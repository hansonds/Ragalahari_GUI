name: Build portable EXE & publish release

# Runs automatically when the app code changes on main,
# and can also be started by hand from the "Actions" tab (Run workflow).
on:
  push:
    branches: [main, master]
    paths:
      - "ragalahari_gui.py"
      - "requirements.txt"
      - "logo.ico"
      - "logo.png"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only one build at a time, so two runs never fight over the same release
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read app version
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -oP 'APP_VERSION = "\K[^"]+' ragalahari_gui.py || true)
          if [ -z "$VERSION" ]; then VERSION="1.0.${{ github.run_number }}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build single-file portable EXE
        run: >
          pyinstaller ragalahari_gui.py
          --name Ragalahari_Downloader
          --onefile --windowed --noconfirm --clean
          --icon logo.ico
          --add-data "logo.ico;."
          --add-data "logo.png;."
          --collect-data customtkinter
          --hidden-import pystray._win32

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ragalahari_Downloader
          path: dist/Ragalahari_Downloader.exe

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          cat > notes.md <<'NOTES'
          ## Ragalahari Gallery Downloader

          **Portable — no install needed.** Download `Ragalahari_Downloader.exe` below and double-click it.

          - Settings are saved next to the EXE (`ragalahari_gui_config.json`)
          - Windows may warn on first run because the EXE is unsigned: click **More info → Run anyway**
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists - replacing the EXE"
            gh release upload "$TAG" dist/Ragalahari_Downloader.exe --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" dist/Ragalahari_Downloader.exe \
              --title "Ragalahari Downloader $TAG" --notes-file notes.md --latest
          fi
