name: Build portable EXE & publish release

on:
  push:
    branches: [main, master]
    paths:
      - "ragalahari_gui.py"
      - "requirements.txt"
      - "logo.ico"
      - "logo.png"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read app version
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -oP 'APP_VERSION = "\K[^"]+' ragalahari_gui.py || true)
          if [ -z "$VERSION" ]; then VERSION="1.0.${{ github.run_number }}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build single-file portable EXE
        run: >
          pyinstaller ragalahari_gui.py
          --name Ragalahari_Downloader
          --onefile --windowed --noconfirm --clean
          --icon logo.ico
          --add-data "logo.ico;."
          --add-data "logo.png;."
          --collect-data customtkinter
          --hidden-import pystray._win32

      - uses: actions/upload-artifact@v4
        with:
          name: Ragalahari_Downloader
          path: dist/Ragalahari_Downloader.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Ragalahari Downloader v${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/Ragalahari_Downloader.exe
          body: |
            **Portable — no install needed.** Download `Ragalahari_Downloader.exe` below and double-click it.
            Windows may warn on first run (unsigned app): click **More info → Run anyway**.
